[project]
name = "tsio"
version = "0.1.0"
description = "A Python Command Line Interface (CLI) application to handle various file formats"
authors = [
    {name = "Christopher Field", email = "chris.field@theiascientific.com"},
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: GPU",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "h5py",
    "multiprocess",
    "numpy",
    "opencv-contrib-python-headless",
    "opencv-python-headless",
    "pydantic",
    "pydantic-settings",
    "pydicom",
    "python-gdcm",
    "rosettasciio[all]",
    "tdqm",
    "tifffile",
    "typer",
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "black",
    "build",
    "flake8",
    "gdown",
    "hatch",
    "isort",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "twine"
]

[project.scripts]
tsio = "tsio.cli:app"

[project.urls]
Homepage = "https://github.com/Theia-Scientific/tsio"
Source = "https://github.com/Theia-Scientific/tsio"
Tracker = "https://github.com/Theia-Scientific/tsio/issues"

[tool.coverage.report]
exclude_lines = [ "if __name__ == .__main__.:" ]
omit = [ "__main__.py" ]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]
